<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab 11</title>
        <style>
            #box{
                background-color: blue;
                color: white;
                font-size: 1.2em;
                width: 200px;
                padding: 3px;
                text-align: center;
            }
            #below{
                height: 75vh;
            }
        </style>
    </head>
    <body>
        <div id = "box">Click Me! 😊</div>
        <div id = "below"></div>
        <script>
            const box = document.getElementById("box");
            const below = document.getElementById("below");
            function mouseover(event){
                box.style.backgroundColor = "yellow";
                box.textContent = "Do not click! 😠";
            }
            function click(event){
                box.style.backgroundColor = "red";
                box.textContent = "Ouch! 🤕";
            }
            function mouseout(event){
                box.style.backgroundColor = "lightgreen";
                box.textContent = "Phew! 😌";
            }
            function dblclick(event){
                box.style.backgroundColor = "pink";
                box.textContent = "Double trouble! 🤩";
            }
            function mousemove(event){
                box.style.backgroundColor = "lightblue";
                box.textContent = "I see you! 👀";
            }
            box.addEventListener("mouseover", mouseover);
            box.addEventListener("click", click);
            box.addEventListener("mouseout", mouseout);
            box.addEventListener("dblclick", dblclick);
            below.addEventListener("mousemove", mousemove);
        </script>
    </body>
</html>
