<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        const site='https://jsonplaceholder.typicode.com/posts';
        let stuff = [];
        const getApi = async()=>{
            try{
                let result = await fetch(site);
                result = await result.json();
                stuff = result;
                console.table(stuff);
            }catch{(reason)=>console.log(reason)}
        }

        const display = async(stuff2 = stuff)=>{
            try {
                for (let x = 0; x < stuff2.length; x++) {
                    const article = document.createElement("article");
                    const h2 = document.createElement("h2");
                    const p = document.createElement("p");
                    h2.textContent = stuff2[x].title;
                    p.textContent = stuff2[x].body + ' userId: ' + stuff2[x].userId + ' id: ' + stuff2[x].id;
                    article.append(h2, p);
                    document.body.appendChild(article);
                }
            }catch{(reason)=>console.log(reason)}
        }

        async function doIt() {
            await getApi();
            await display();
        }
        doIt();

        document.getElementById('filterBtn').addEventListener('click', ()=>{
            filterPosts();
        });

        const filterPosts = ()=>{
            const selected = document.getElementById('userID').value;
            const userPosts = stuff.filter((post) => post.userId === Number(selected));
            console.table(userPosts);
        }

        const clear = ()=>{
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
        }

        const showMessage = (message)=>{
            const article = document.createElement("article");
            const p = document.createElement("p");
            p.textContent = message;
            article.append(p);
            document.body.appendChild(article);
        }

        const displayUserPosts = ()=>{
            const userId = Number(document.getElementById('displayUserID').value);
            clear();
            const userPosts = stuff.filter((post) => post.userId === userId);
            display(userPosts);
        }
        document.getElementById('displayUserBtn').addEventListener('click', displayUserPosts);

        const findPost = ()=>{
            const postId = Number(document.getElementById('postID').value);
            clear();
            const found = stuff.find((post) => post.id === postId);
            if (found) {
                display([found]);
            } else {
                showMessage("Post is not found");
            }
        }
        document.getElementById('findBtn').addEventListener('click', findPost);

    </script>

</body>
</html>
