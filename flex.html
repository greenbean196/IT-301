<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>flex</title>
    </head>
    <style>
        div {
                  margin: 0;                 /* the ONE margin/padding used in the file */
      min-height: 100vh;
      display: flex;
      flex-direction: column;    /* stack the rows top to bottom */
      justify-content: center;   /* vertical centering */
      align-items: center;       /* horizontal centering */
      gap: 10px;                 /* same gap as between squares */
      background-color: #f0f0f0;
      font-family: Arial, Helvetica, sans-serif;

        }
        .flex-item-1, .flex-item-2, .flex-item-3 {
            width: 100px;
            height: 100px;
            line-height: 100px;
            text-align: center;
            font-weight: bold;
            color: white;
            background-color: steelblue;
            border: 2px solid #1f4e79;
                  width: 50%;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;   /* keep the squares packed together */
      align-items: center;
      gap: 10px;


        }
    </style>
    <body>
        <div>
            <div class="flex-item-1">A</div>
            <div class="flex-item-2">B</div>
            <div class="flex-item-3">C</div>
            <div class="flex-item-1">D</div>
            <div class="flex-item-2">E</div>
            <div class="flex-item-3">F</div>
            <div class="flex-item-1">G</div>
            <div class="flex-item-2">H</div>
            <div class="flex-item-3">I</div>
        </div>
    </body>
</html>
