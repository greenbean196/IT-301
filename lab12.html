<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab 12</title>
    </head>
    <body>
        <form action="#" id="form1">
            <label for="name">What is your name?</label>
            <input id="name"> <br><br>
            <button id="bttn" type="button">Greet Me</button>
        </form>
        <p id="result"></p>
        <form action="#" id="form2">
            <label for="num1">Number 1:</label>
            <input type="number" id="num1"> <br><br>
            <label for="num2">Number 2:</label>
            <input type="number" id="num2"> <br><br>
            <input type="radio" name="thing" value="add">Add<br>
            <input type="radio" name="thing" value="sub">Sub<br>
            <input type="radio" name="thing" value="mut">Mut<br>
            <input type="radio" name="thing" value="div">Div<br><br>
            <button id="select" type="button">Submit</button>
        </form>
        <p id="numResult"></p>
        <button id="clear" type="button">Clear</button>

        <script>
            const name = document.getElementById('name');
            const result = document.getElementById('result');
            const num1 = document.getElementById('num1');
            const num2 = document.getElementById('num2');
            const numResult = document.getElementById('numResult');

            document.getElementById('bttn').addEventListener('click', function(){
                result.textContent = `Welcome ` + name.value;
            });
            document.getElementById('select').addEventListener('click', function(){
                const thing1 = document.querySelector(`[name = thing]:checked`);
                if (thing1.value = `add`) {numResult.textContent = Number(num1.value) + Number(num2.value)};
                if (thing1.value = `sub`) {numResult.textContent = Number(num1.value) - Number(num2.value)};
                if (thing1.value = `mut`) {numResult.textContent = Number(num1.value) * Number(num2.value)};
                if (thing1.value = `div`) {numResult.textContent = Number(num1.value) / Number(num2.value)};
            });
            document.getElementById('clear').addEventListener('click', function(){
                document.getElementById('form1').reset();
                document.getElementById('form2').reset();
                result.textContent = "";
                numResult.textContent = "";
            });
        </script>
    </body>
</html>
